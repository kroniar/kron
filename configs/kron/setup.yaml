# Default setup configuration for Kron
# Users can override or extend it in ~/.kron/setup.yaml

tools:
  docker:
    linux: |
      curl -fsSL https://get.docker.com | sudo bash && sudo usermod -aG docker $USER && newgrp docker && docker --version && docker compose version
    darwin: |
      brew install --cask docker
    windows: |
      echo "Please install Docker Desktop manually: https://www.docker.com/products/docker-desktop/"

  kubectl:
    linux: |
      curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      chmod +x kubectl
      sudo mv kubectl /usr/local/bin/
    darwin: |
      brew install kubectl
    windows: |
      echo "Install kubectl manually: https://kubernetes.io/docs/tasks/tools/"

  prometheus:
    linux: |
      curl -LO https://github.com/prometheus/prometheus/releases/latest/download/prometheus-2.48.0.linux-amd64.tar.gz
      tar xvf prometheus-2.48.0.linux-amd64.tar.gz
      sudo mv prometheus-2.48.0.linux-amd64 /usr/local/bin/prometheus
    darwin: |
      brew install prometheus
    windows: |
      echo "Please download Prometheus manually from https://prometheus.io/download/"

  grafana:
    linux: |
      sudo apt-get install -y adduser libfontconfig1
      wget https://dl.grafana.com/oss/release/grafana_10.4.0_amd64.deb
      sudo dpkg -i grafana_10.4.0_amd64.deb
    darwin: |
      brew install grafana
    windows: |
      echo "Please install Grafana manually from https://grafana.com/"

  vscode:
    linux: |
      sudo apt install code -y || sudo snap install code --classic
    darwin: |
      brew install --cask visual-studio-code
    windows: |
      echo "Install VSCode manually: https://code.visualstudio.com/"
